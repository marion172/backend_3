paths:
  /api/users:
    get:
      tags:
        - Users
      summary: Get all users
      description: Retrieves a list of all users in the system.
      responses:
        '200':
          $ref: '#/components/responses/UsersListResponse'

    post:
      tags:
        - Users
      summary: Create a new user
      description: Creates a new user in the system. The email must be unique.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/UserCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'

  /api/users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Retrieves details of a specific user by ID.
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

    patch:
      tags:
        - Users
      summary: Update a user by ID
      description: Updates details of an existing user by ID.
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

    delete:
      tags:
        - Users
      summary: Delete a user by ID
      description: Deletes a specific user from the system.
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'

  /api/users/{id}/documents:
    post:
      tags:
        - Users
      summary: Upload user document
      description: Uploads a document (identification, license, etc.) for a specific user.
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Document file (JPG, PNG, PDF up to 5MB)
                documentType:
                  type: string
                  description: Type of document
                  enum:
                    - identification
                    - license
                    - receipt
                    - invoice
                    - delivery_proof
                  example: identification
      responses:
        '200':
          description: Document uploaded successfully and user entity updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'


